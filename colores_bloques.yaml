# Color de relleno y posición ideológica aproximada por bloque, para el
# hemiciclo (panel derecho del HTML de resultado). Editable sin tocar
# código ni la plantilla HTML.
#
# "orden": posición en el arco de izquierda (número bajo) a derecha
# (número alto) — izquierda/Unión por la Patria a la izquierda, La
# Libertad Avanza a la derecha, bloques de centro/provinciales en el
# medio. Estos valores (color y orden) son los que ya se usaron para
# aprobar visualmente la plantilla (plantilla_resultado.html) — no
# cambiarlos sin volver a mirar cómo queda el hemiciclo.
#
# Cualquier bloque que no esté acá cae en "_default".

